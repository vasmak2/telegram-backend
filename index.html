<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин Очков</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            text-align: center;
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 15px;
            background: var(--tg-theme-secondary-bg-color, #f9f9f9);
            margin: 20px auto;
            max-width: 280px;
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>🕶️ Resale Sunglasses Shop</h2>
    <p>Эксклюзивные брендовые очки с доставкой</p>

    <div class="card">
        <h3>Aviator Classic Black</h3>
        <p>Цена: 5 900 ₽</p>
        <button class="btn" id="buy-btn">Оформить заказ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Открываем миниап сразу на всю высоту

        // Сюда вставляешь публичный URL, который выдаст Render после деплоя
        const BACKEND_URL = "https://твой-проект.onrender.com"; 

        document.getElementById('buy-btn').addEventListener('click', async () => {
            // Кнопка показывает лоадер, пока бэкенд может "просыпаться"
            tg.MainButton.setText("Оформление...").show();

            try {
                const response = await fetch(`${BACKEND_URL}/api/checkout`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        init_data: tg.initData, // Передаем данные пользователя и хэш для проверки
                        item_id: "aviator_classic_001",
                        quantity: 1
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    tg.MainButton.hide();
                    tg.showPopup({
                        title: 'Заказ создан',
                        message: data.message,
                        buttons: [{id: 'pay', type: 'default', text: 'Оплатить'}]
                    }, (buttonId) => {
                        if (buttonId === 'pay') {
                            tg.openLink(data.payment_url); // Открываем платежную систему
                        }
                    });
                } else {
                    tg.showAlert("Ошибка: " + (data.detail || "неизвестный сбой"));
                    tg.MainButton.hide();
                }
            } catch (error) {
                tg.showAlert("Сервер временно не ответил. Попробуйте нажать еще раз через 30 секунд (база «просыпается»).");
                tg.MainButton.hide();
            }
        });
    </script>
</body>
</html>
